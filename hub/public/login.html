<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siribots - Login Administrativo</title>
  <style>
    body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: white; width: 100%; max-width: 380px; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; margin-top: 0; text-align: center; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #495057; font-weight: bold; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
    .btn { width: 100%; background: #ff914d; color: white; padding: 14px; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: background 0.3s; }
    .btn:hover { background: #e07b3c; }
    .error-msg { color: #e74c3c; background: #fdeaea; padding: 10px; border-radius: 5px; margin-top: 15px; text-align: center; display: none; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Acesso Restrito</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div id="error-msg" class="error-msg">Usuário ou senha incorretos</div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = e.target.querySelector('button');
      
      errorMsg.style.display = 'none';
      submitBtn.textContent = 'Autenticando...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (data.ok) {
          window.location.href = '/admin';
        } else {
          errorMsg.textContent = data.error || 'Erro ao autenticar';
          errorMsg.style.display = 'block';
          submitBtn.textContent = 'Entrar';
          submitBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = 'Erro ao conectar ao servidor';
        errorMsg.style.display = 'block';
        submitBtn.textContent = 'Entrar';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
